<header class="topbar">
  <a routerLink="/" class="brand">
    <span class="logo">AWS</span> Lab
  </a>

  <nav class="links">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/perfil" routerLinkActive="active">Perfil</a>
    <a routerLink="/privado" routerLinkActive="active">Privado</a>
  </nav>

  <div class="session">
    @if (isAuthenticated()) {
      <span class="email">{{ email() }}</span>
      <button class="btn ghost" (click)="logout()">Cerrar sesión</button>
    } @else {
      <button class="btn primary" (click)="login()">Iniciar sesión</button>
    }
  </div>
</header>

<main class="container">
  <router-outlet />
</main>
