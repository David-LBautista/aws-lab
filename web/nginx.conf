server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: rutas de Angular devuelven index.html (como las error pages de CloudFront)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html sin caché (igual que en el pipeline)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}