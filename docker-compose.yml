services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab_password
      POSTGRES_DB: awslab
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d awslab"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      PORT: 3000
      DATABASE_URL: postgres://lab:lab_password@db:5432/awslab
      COGNITO_USER_POOL_ID: us-east-1_e0sVyNKCW
      COGNITO_CLIENT_ID: 5oj7qo4f1e3oapck7qvuc2af6r
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  agents:
    build: ./agents
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      AGENT_MODE: mock
      MOCK_DELAY_MS: 35
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-5-5}

  web:
    build:
      context: ./web
      args:
        NG_CONFIG: docker
    ports:
      - "4200:80"
    depends_on:
      agents:
        condition: service_healthy

volumes:
  db-data:
