name: Deploy to AWS

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # main → prod, develop → dev
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://lab.davidlucas.dev' || 'https://dev-lab.davidlucas.dev' }}

    # Un deploy a la vez por ambiente
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload hashed assets
        run: >
          aws s3 sync dist/aws-lab/browser s3://${{ vars.S3_BUCKET }}
          --delete --exclude index.html
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        run: >
          aws s3 cp dist/aws-lab/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CF_DISTRIBUTION_ID }}
          --paths "/index.html"