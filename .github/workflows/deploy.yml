name: Deploy to AWS

on:
  push:
    branches: [main, develop]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA o tag a desplegar (vacío = último de la rama)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://lab.davidlucas.dev' || 'https://dev-lab.davidlucas.dev' }}

    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Versiones nuevas viven en web/; tags viejos (antes del monorepo) en la raíz
      - name: Detect app folder
        id: app
        run: |
          if [ -f web/angular.json ]; then
            echo "dir=web" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.app.outputs.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.app.outputs.dir }}
        run: npm ci

      - name: Test
        if: ${{ !inputs.ref }}
        working-directory: ${{ steps.app.outputs.dir }}
        run: npx ng test --watch=false

      - name: Build
        working-directory: ${{ steps.app.outputs.dir }}
        run: npx ng build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload hashed assets
        working-directory: ${{ steps.app.outputs.dir }}
        run: >
          aws s3 sync dist/aws-lab/browser s3://${{ vars.S3_BUCKET }}
          --delete --exclude index.html
          --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        working-directory: ${{ steps.app.outputs.dir }}
        run: >
          aws s3 cp dist/aws-lab/browser/index.html s3://${{ vars.S3_BUCKET }}/index.html
          --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CF_DISTRIBUTION_ID }}
          --paths "/index.html"

      - name: Tag release
        if: github.ref_name == 'main' && !inputs.ref
        run: |
          git fetch --tags --force
          LAST=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LAST" ]; then
            NEXT="v1.0.0"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEXT="v$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          git tag "$NEXT" "${{ github.sha }}"
          git push origin "$NEXT"
          echo "### Released $NEXT" >> "$GITHUB_STEP_SUMMARY"
